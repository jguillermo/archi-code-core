name: CI

on:
  pull_request:
    branches: [main, release]

jobs:
  test:
    name: Test all packages
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: npm ci

      - name: Build packages in dependency order
        run: npm run build

      - name: Root editorconfig
        run: npm run check:editorconfig

      # Every package runs the same gate: editorconfig, prettier, eslint, tsc on src/test,
      # jest with its coverage threshold, CJS+ESM build and dist checks.
      - name: All packages — full gate (check:all)
        run: npm run check:packages
