name: CI

on:
  pull_request:
    branches: [main, release]

jobs:
  test:
    name: Test all packages
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Install dependencies
        run: npm ci

      - name: Build packages in dependency order
        run: npm run build

      # Shared scripts (prettier + node --test), editorconfig over the repo, then the same gate in
      # every package (check:packages): editorconfig, prettier, eslint, tsc on src/test, jest with
      # its coverage threshold, CJS+ESM build and dist checks.
      - name: Root checks and full gate of every package
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run check
