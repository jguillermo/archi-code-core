name: CI

on:
  pull_request:
    branches: [main, release]

jobs:
  test:
    name: Test all packages
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Install dependencies
        run: npm ci

      # @archi-code/crypto-tools compiles its Rust core to wasm: the toolchain comes from
      # packages/crypto-tools/rust/rust-toolchain.toml and wasm-pack is a prebuilt binary.
      - name: Install the Rust toolchain of crypto-tools
        working-directory: packages/crypto-tools/rust
        run: rustup toolchain install

      - name: Install wasm-pack
        uses: taiki-e/install-action@v2
        with:
          tool: wasm-pack@0.13.1

      - name: Cache Rust builds
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: packages/crypto-tools/rust

      # check:dist of @archi-code/crypto-tools runs its build in real browsers (scripts/check-browser.js).
      - name: Install the browsers of Playwright
        run: npx playwright install --with-deps chromium firefox webkit

      # @archi-code/criteria-adapters runs its MongoDB specs on the mongod binaries that
      # mongodb-memory-server downloads (about 140 MB per version); keep them between runs.
      - name: Cache the MongoDB binaries
        uses: actions/cache@v4
        with:
          path: ~/.cache/mongodb-binaries
          key: mongodb-binaries-${{ runner.os }}-${{ hashFiles('packages/criteria-adapters/package.json') }}
          restore-keys: mongodb-binaries-${{ runner.os }}-

      - name: Build packages in dependency order
        run: npm run build

      # Shared scripts (prettier + node --test), editorconfig over the repo, then the same gate in
      # every package (check:packages): editorconfig, prettier, eslint, tsc on src/test, jest with
      # its coverage threshold, CJS+ESM build and dist checks.
      - name: Root checks and full gate of every package
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run check
