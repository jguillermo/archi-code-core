name: CI

on:
  pull_request:
    branches: [main, release]

jobs:
  test:
    name: Test all packages
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Build packages in dependency order
        run: npm run build

      - name: Run tests
        run: npm run test

      # @archi-code/validation reliability gates: types (strict), lint, and the 100% coverage
      # threshold (contract, canBe⇔convertTo properties, import-cycle guard, ReDoS, parity).
      - name: validation — typecheck (src + tests)
        run: npx tsc -p packages/validation/tsconfig.json --noEmit --incremental false

      - name: validation — lint
        run: npm run check:lint -w @archi-code/validation

      - name: validation — tests with coverage threshold
        run: npm run test:coverage -w @archi-code/validation
