name: Release

# Runs on every push: the plan only releases packages with commits since their last tag (and
# their dependents); when nothing changed it ends with "Nada que publicar".
on:
  push:
    branches: [main, release]

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    name: Release changed packages and their dependents
    runs-on: ubuntu-latest
    environment: deploy
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: npm ci

      - name: Configure git for release tags
        run: |
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"

      # Tests and lint run in the pull request CI (ci.yml); publishing only builds.
      - name: Build packages in dependency order
        run: npm run build

      - name: Release plan
        run: npm run version

      # Publishes only the packages in the plan, in dependency order: exact versions are written
      # into the packed package.json only, then npm publish, tag <name>-vX.Y.Z and a GitHub release.
      - name: Publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run release
