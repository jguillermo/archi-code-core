name: Release

# Runs on every push: releases.json (the source of truth) says what is published and from which
# commit; only packages with releasing commits since then (and their dependents) are published,
# and the record commit pushed back by the release carries [skip ci] so it does not loop.
on:
  push:
    branches: [main, release]

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    name: Release changed packages and their dependents
    runs-on: ubuntu-latest
    environment: deploy
    # A healthy release takes 2-3 minutes; a stuck step is cut instead of waiting for GitHub's 6 h.
    timeout-minutes: 15
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: npm ci

      - name: Configure git for the releases.json record commit
        run: |
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"

      # Tests and lint run in the pull request CI (ci.yml); publishing only builds.
      - name: Build packages in dependency order
        run: npm run build

      - name: Release plan
        run: npm run version

      # Publishes the plan in dependency order (exact versions only in the packed package.json),
      # records every publication in releases.json and pushes it to the branch.
      - name: Publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm run release
