[package]
name = "crypto_tools"
version = "0.0.0"
edition = "2024"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = "0.2"
getrandom = { version = "0.2", features = ["js"] }
getrandom_03 = { package = "getrandom", version = "0.3", features = ["wasm_js"] }
getrandom_04 = { package = "getrandom", version = "0.4", features = ["wasm_js"] }
sha2 = "0.10"
blake2 = "0.10"
hmac = "0.12"
hkdf = "0.12"
hex = "0.4"
base64 = "0.22"
bcrypt = "0.17"
argon2 = "0.5"
aes = "0.8"
cbc = { version = "0.1", features = ["alloc"] }
aes-gcm = "0.10"
chacha20poly1305 = "0.10"
subtle = "2"
rsa = { version = "0.9", features = ["sha2"] }
pasetors = { version = "0.8", default-features = false, features = ["v4"] }
jsonwebtoken = { version = "11", default-features = false, features = ["rust_crypto", "use_pem"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rand_core = { version = "0.6", features = ["getrandom"] }
time = { version = "0.3", features = ["formatting", "parsing"] }

[profile.dev.package."*"]
opt-level = 3

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
